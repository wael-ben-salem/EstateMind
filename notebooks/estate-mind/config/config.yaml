# EstateMind configuration
features_version: "v1.0"
nlp_schema_version: "v1.0"
model_version: "lgbm_v1"

llm:
  extraction:
    model: "llama3:8b"
    provider: "ollama"
    temperature: 0.1
    max_tokens: 1024
    top_p: 0.9
  explanation:
    model: "mistral:7b-instruct"
    provider: "ollama"
    temperature: 0.3
    max_tokens: 256

embeddings:
  model: "BAAI/bge-small-en-v1.5"
  dim_reduction: "pca"
  n_components: 32

vision:
  vlm_model: "qwen2-vl"
  clip_model: "openai/clip-vit-base-patch32"
  max_images_per_listing: 10

ml:
  backend: "lightgbm"
  target: "prix"
  test_size: 0.2
  random_state: 42

api:
  host: "0.0.0.0"
  port: 8000

cache:
  redis_enabled: false
  redis_url: "redis://localhost:6379/0"
