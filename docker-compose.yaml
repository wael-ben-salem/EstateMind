services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow:
    build: ./airflow
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_HOME: /opt/airflow
      LLM_API_KEY: ${LLM_API_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/spark_app
      - ./output:/opt/output
      - ./scraper:/opt/project/scraper
      - ./agent:/opt/project/agent
      - ./agent_price:/opt/project/agent_price
    command: standalone

  spark:
    build: ./spark
    container_name: spark-etl
    volumes:
      - ./spark:/opt/spark_app
      - ./output:/opt/output
    working_dir: /opt/spark_app
    command: tail -f /dev/null

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/tayara-raw || true &&
      mc mb -p local/tayara-processed || true &&
      exit 0
      "

  # Backend API service for data queries
  backend:
    build: ./backend
    container_name: estateMind-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_API_URL=http://airflow:8080/api/v1
      - AIRFLOW_DAG_ID=tayara_ai_agent_pipeline
      - AIRFLOW_USERNAME=admin
      - AIRFLOW_PASSWORD=admin
    depends_on:
      - postgres
      - airflow

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estateMind-frontend
    ports:
      - "8082:80"
    depends_on:
      - airflow
      - backend
    environment:
      REACT_APP_API_URL: http://localhost/api
      REACT_APP_AIRFLOW_URL: http://localhost/airflow/api
    restart: always

volumes:
  postgres-db-volume:
    external: true
    name: etl_postgres-db-volume